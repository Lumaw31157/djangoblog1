<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'blog/css/style.css' %}?v=2">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3 d-flex justify-content-between">
    <a class="navbar-brand" href="{% url 'home' %}">DjangoBlog</a>
    <div>
        {% if request.user.is_authenticated %}
        <a class="btn btn-outline-light btn-sm" href="{% url 'my_posts' %}">My Posts</a>
            <a class="btn btn-success btn-sm" href="{% url 'post_create' %}">New Post</a>
            <span class="text-white ms-2">Hi, {{ request.user.username }}</span>
            <form method="post" action="{% url 'logout' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        {% else %}
            <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Login</a>
            <a class="btn btn-outline-light btn-sm" href="{% url 'register' %}">Register</a>
        {% endif %}
    </div>
</nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
